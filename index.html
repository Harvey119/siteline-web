<!doctype html>
<!-- 예전 예비 주소 harvey119.github.io/siteline-web 용 (168절): ys-eng.kr 로 넘긴다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E:UM</title>
<script>
  // 예전 앱이 이 주소에 남긴 서비스 워커 · 보관본을 지우고 넘어간다 (화면 주소 #/... 는 그대로)
  (function () {
    var go = function () { location.replace('https://ys-eng.kr/' + location.hash); };
    var jobs = [];
    try {
      if ('serviceWorker' in navigator) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (e) {}
    Promise.all(jobs).then(go, go);
    setTimeout(go, 1500);
  })();
</script>
</head>
<body style="font-family:sans-serif;padding:24px">
<p>E:UM 주소가 바뀌었습니다. 잠시 뒤 <a href="https://ys-eng.kr/">ys-eng.kr</a> 로 이동합니다.</p>
</body>
</html>
